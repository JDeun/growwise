[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growwise"
version = "0.1.0a0"
description = "Local-first personal education OS for long-term child learning tracking, knowledge organization, and material generation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Yong-eun Cho" }]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "langchain>=0.3,<1",
  "langgraph>=0.6,<1",
  "sqlalchemy>=2.0,<3",
  "python-frontmatter>=1.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[project.scripts]
growwise = "growwise.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/growwise"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
