[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growwise"
version = "0.1.0a0"
description = "Local-first personal education OS for long-term child learning tracking, knowledge organization, and material generation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Yong-eun Cho" }]
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "langchain-core>=1.2.22,<2",
  "langchain-ollama>=1.1,<2",
  "langchain-text-splitters>=1.1.2,<2",
  "langgraph>=1.2.11,<2",
  "langgraph-checkpoint>=4.1.1,<5",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
  "python-frontmatter>=1.1,<2",
  "uuid6>=2025.0.1,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "pre-commit>=4,<5",
]
hygiene = [
  "pip-audit>=2.9,<3",
  "pip-licenses>=5,<6",
]
desktop-build = [
  "pyinstaller>=6,<7",
]

[project.scripts]
growwise = "growwise.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/growwise"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/growwise/api/*.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
