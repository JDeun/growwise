[package]
name = "growwise-desktop"
version = "0.1.0-alpha.0"
description = "GrowWise Personal Education OS desktop shell"
authors = ["GrowWise contributors"]
license = "Apache-2.0"
repository = "https://github.com/JDeun/growwise"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "growwise_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
