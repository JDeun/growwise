name: Patch study UI once

on:
  push:
    branches: [codex/study-ui]
    paths:
      - .github/workflows/patch-study-ui.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/study-ui
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - name: Integrate study desktop UI
        run: python .github/scripts/patch_study_ui.py
      - name: Verify frontend
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Verify Rust shell
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --all
          cargo check --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Commit verified study UI and remove one-time patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/patch_study_ui.py .github/workflows/patch-study-ui.yml
          git add desktop/src/App.tsx desktop/src/StudyPanel.tsx desktop/src/studyApi.ts desktop/src-tauri/src/lib.rs
          git commit -m "feat: add middle and high study desktop UI"
          git push origin HEAD:codex/study-ui
