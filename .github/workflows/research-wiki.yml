name: Research Wiki

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-research-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Check offline links, metadata and append-only evidence
        run: python scripts/research_wiki.py check --base-ref "$WIKI_BASE_REF"
        env:
          WIKI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Test research lifecycle and candidate boundary
        run: uv run pytest tests/test_research_wiki.py
