name: Ruff Fix Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.7"
      - name: Canonicalize imports
        run: ruff check --fix src/growwise/workflows/runtime.py
      - name: Commit fix when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/growwise/workflows/runtime.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: canonicalize workflow imports"
          git push origin HEAD:main
