name: Generate branded desktop icons once

on:
  push:
    branches: [codex/desktop-packaging]
    paths:
      - .github/workflows/generate-icons-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/desktop-packaging
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Generate icon set
        working-directory: desktop
        run: npm run tauri -- icon ../assets/brand/growwise-symbol.svg
      - name: Commit branded icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src-tauri/icons
          git diff --cached --quiet && exit 0
          git commit -m "build: commit branded desktop icons"
          git push origin HEAD:codex/desktop-packaging
