name: Patch portable backup once

on:
  push:
    branches: [codex/portable-backup]
    paths:
      - .github/workflows/patch-portable-backup.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/portable-backup
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - name: Apply portable backup patch
        run: python .github/scripts/patch_portable_backup.py
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Verify Python
        run: |
          uv sync --locked --extra dev
          uv run ruff check --fix src/growwise/backup tests/test_backup.py tests/test_backup_cli.py
          uv run ruff check src tests desktop/scripts
          uv run mypy src/growwise
          uv run pytest tests/test_backup.py tests/test_backup_cli.py tests/test_backup_api.py
      - name: Verify frontend
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Refresh Rust lock and verify shell
        working-directory: desktop/src-tauri
        run: |
          cargo update
          cargo fmt --all
          cargo check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Commit verified portable backup slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/growwise/backup/cli.py \
            src/growwise/backup/service.py \
            tests/test_backup.py \
            tests/test_backup_cli.py \
            desktop/src/api.ts \
            desktop/src/App.tsx \
            desktop/src-tauri/Cargo.toml \
            desktop/src-tauri/Cargo.lock \
            desktop/src-tauri/src/lib.rs
          git commit -m "feat: add portable backup import and export"
          git push origin HEAD:codex/portable-backup
