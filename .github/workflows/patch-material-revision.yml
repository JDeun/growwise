name: Patch material revision slice once

on:
  push:
    branches: [codex/finish-growwise]
    paths:
      - .github/workflows/patch-material-revision.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/finish-growwise
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch revision API and adversarial coverage
        run: python .github/scripts/patch_material_revision.py
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Sync locked environment
        run: uv sync --locked --extra dev
      - name: Verify Python slice
        run: |
          uv run ruff check src tests desktop/scripts
          uv run mypy src/growwise
          uv run pytest tests/test_materials.py tests/test_material_adversarial.py tests/test_material_review_workflow.py
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/growwise/api/main.py tests/test_material_adversarial.py
          git commit -m "feat: complete material revision API loop"
          git push origin HEAD:codex/finish-growwise
