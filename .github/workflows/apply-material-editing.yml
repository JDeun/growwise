name: Apply material editing slice

on:
  push:
    branches: [codex/material-edit-rebased]
    paths:
      - .github/workflows/apply-material-editing.yml
      - .github/scripts/apply_material_editing.py

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/material-edit-rebased
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply integration
        run: python .github/scripts/apply_material_editing.py
      - name: Format generated source
        run: |
          python -m pip install "uv==0.12.13"
          uv sync --locked --extra dev
          uv run ruff format src/growwise/api/main.py src/growwise/domain/models.py src/growwise/generators
          uv run ruff check --fix src/growwise/api/main.py src/growwise/domain/models.py src/growwise/generators
      - name: Commit integration source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_material_editing.py .github/workflows/apply-material-editing.yml
          git add src/growwise
          git commit -m "feat: add immutable parent material editing"
          git push origin HEAD:codex/material-edit-rebased
