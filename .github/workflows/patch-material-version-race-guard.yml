name: Patch material version race guard once

on:
  push:
    branches: [codex/material-version-race-guard]
    paths:
      - .github/workflows/patch-material-version-race-guard.yml
      - .github/scripts/patch_material_version_race_guard.py
      - src/growwise/material_versions.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/material-version-race-guard
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Integrate per-material successor guard
        run: python .github/scripts/patch_material_version_race_guard.py
      - name: Verify Python core
        run: |
          uv lock --check
          uv run ruff check src tests desktop/scripts
          uv run mypy src/growwise
          uv run pytest
      - name: Commit verified integration and remove one-time patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/patch_material_version_race_guard.py .github/workflows/patch-material-version-race-guard.yml
          git add src/growwise/api/main.py src/growwise/material_versions.py tests/test_material_version_concurrency.py
          git commit -m "fix: serialize material successor creation"
          git push origin HEAD:codex/material-version-race-guard
