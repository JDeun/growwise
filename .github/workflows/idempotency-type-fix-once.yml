name: Idempotency Type Fix Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix UUID type widening
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/growwise/api/main.py")
          text = path.read_text(encoding="utf-8")
          old = "    reserved_log_id = uuid7()\n    claim = None\n"
          new = "    reserved_log_id: UUID = uuid7()\n    claim = None\n"
          if old not in text:
              raise SystemExit("UUID typing anchor not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/growwise/api/main.py
          git commit -m "fix: widen reserved observation UUID type"
          git push origin HEAD:main
