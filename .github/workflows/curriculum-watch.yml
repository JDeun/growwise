name: Curriculum Watch

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-curriculum-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Install reviewed Python runtime
        shell: bash
        run: python desktop/scripts/install_packaging_python.py --github-env "$GITHUB_ENV"
      - name: Sync locked runtime
        run: uv sync --locked
      - name: Detect unknown official curriculum revisions
        run: uv run python scripts/check_curriculum_updates.py --strict > "$RUNNER_TEMP/growwise-curriculum-watch.json"
      - name: Prepare review-only research candidates
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/growwise-curriculum-watch.json" ]; then
            python scripts/research_wiki.py curriculum-candidates \
              "$RUNNER_TEMP/growwise-curriculum-watch.json" \
              > "$RUNNER_TEMP/growwise-curriculum-candidates.jsonl"
          fi
      - name: Upload public curriculum review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: growwise-curriculum-review
          path: |
            ${{ runner.temp }}/growwise-curriculum-watch.json
            ${{ runner.temp }}/growwise-curriculum-candidates.jsonl
          if-no-files-found: warn
          retention-days: 30
