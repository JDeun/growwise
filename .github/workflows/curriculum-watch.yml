name: Curriculum Watch

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-curriculum-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Sync locked runtime
        run: uv sync --locked
      - name: Detect unknown official curriculum revisions
        run: uv run python scripts/check_curriculum_updates.py --strict
