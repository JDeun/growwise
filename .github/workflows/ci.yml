name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Verify lock is current
        run: uv lock --check
      - name: Ruff
        run: uv run ruff check src tests scripts desktop/scripts
      - name: Mypy
        run: >-
          uv run mypy src/growwise
          --warn-unused-ignores
          --warn-redundant-casts
          --warn-unreachable
          --check-untyped-defs
      - name: Test
        run: uv run pytest
        env:
          GROWWISE_PII_DENYLIST: ${{ secrets.GROWWISE_PII_DENYLIST }}

  python-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Install pinned coverage tool
        run: uv pip install --python .venv/bin/python "coverage==7.16.1"
      - name: Measure branch coverage
        run: uv run --no-sync coverage run --branch --source=src/growwise -m pytest
      - name: Enforce branch coverage floor
        run: >-
          uv run --no-sync coverage report
          --show-missing
          --skip-covered
          --fail-under=78

  dependency-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Verify lock is current
        run: uv lock --check
      - name: Export exact locked runtime graph
        run: >-
          uv export --locked --no-dev --no-emit-project --no-hashes
          --format requirements-txt --output-file /tmp/growwise-runtime.txt
      - name: Python vulnerability audit
        run: uv run --locked --extra hygiene pip-audit --strict -r /tmp/growwise-runtime.txt
      - name: Python license inventory
        run: uv run --locked --extra hygiene pip-licenses --format=markdown --with-urls

  desktop-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Pin npm
        run: npm install --global npm@11.6.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Node vulnerability audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser E2E and visual smoke
        run: npm run test:e2e
      - name: Upload browser E2E screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: growwise-browser-e2e
          path: desktop/artifacts/browser-e2e
          if-no-files-found: warn
          retention-days: 7
      - name: Upload frontend production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: growwise-frontend-dist
          path: desktop/dist
          if-no-files-found: error
          retention-days: 3

  rust-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Verify locked Rust dependency graph
        working-directory: desktop/src-tauri
        run: cargo metadata --locked --format-version=1 --no-deps > /dev/null
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Rust vulnerability audit
        working-directory: desktop/src-tauri
        run: cargo audit

  desktop-tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - name: Check Rust shell
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets

  rust-platform-tests:
    name: rust-platform-tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Rust shell
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Rust tests
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets

  core-sidecar-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install sidecar build dependencies
        run: python -m pip install -e ".[desktop-build]"
      - name: Build Core executable
        run: python desktop/scripts/build_core_sidecar.py
      - name: Smoke authenticated bundled Core
        run: python desktop/scripts/smoke_core_sidecar.py --timeout 30
