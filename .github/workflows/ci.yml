name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests desktop/scripts
      - name: Test
        run: pytest

  dependency-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[hygiene]"
      - name: Python vulnerability audit
        run: pip-audit --strict --skip-editable
      - name: Python license inventory
        run: pip-licenses --format=markdown --with-urls

  desktop-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  desktop-tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - name: Check Rust shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml

  core-sidecar-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install sidecar build dependencies
        run: python -m pip install -e ".[desktop-build]"
      - name: Build Core executable
        run: python desktop/scripts/build_core_sidecar.py
      - name: Start bundled Core
        env:
          GROWWISE_DATA_DIR: ${{ runner.temp }}/growwise-smoke
          GROWWISE_LLM_FEATURES_ENABLED: "false"
          GROWWISE_EMBEDDING_FEATURES_ENABLED: "false"
        run: |
          ./desktop/src-tauri/binaries/growwise-core > /tmp/growwise-core.log 2>&1 &
          echo $! > /tmp/growwise-core.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8765/health > /tmp/growwise-health.json; then
              cat /tmp/growwise-health.json
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/growwise-core.log
          exit 1
      - name: Stop bundled Core
        if: always()
        run: |
          if [ -f /tmp/growwise-core.pid ]; then
            kill "$(cat /tmp/growwise-core.pid)" 2>/dev/null || true
          fi
