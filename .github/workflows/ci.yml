name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-core:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Verify lock is current
        run: uv lock --check
      - name: Ruff
        run: uv run ruff check src tests desktop/scripts
      - name: Mypy
        run: uv run mypy src/growwise
      - name: Test
        run: uv run pytest

  dependency-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install ".[hygiene]"
      - name: Build third-party audit requirement set
        run: |
          python -m pip freeze > /tmp/growwise-freeze.txt
          python - <<'PY'
          from pathlib import Path

          source = Path("/tmp/growwise-freeze.txt")
          target = Path("/tmp/growwise-audit-requirements.txt")
          lines = []
          for line in source.read_text(encoding="utf-8").splitlines():
              normalized = line.casefold()
              if normalized.startswith(("growwise==", "growwise @", "-e file:")):
                  continue
              lines.append(line)
          target.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Python vulnerability audit
        run: pip-audit --strict -r /tmp/growwise-audit-requirements.txt
      - name: Python license inventory
        run: pip-licenses --format=markdown --with-urls

  desktop-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Pin npm
        run: npm install --global npm@11.6.2
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Node vulnerability audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  rust-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: Verify locked Rust dependency graph
        working-directory: desktop/src-tauri
        run: cargo metadata --locked --format-version=1 --no-deps > /dev/null
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Rust vulnerability audit
        working-directory: desktop/src-tauri
        run: cargo audit

  desktop-tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev
      - name: Check Rust shell
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

  core-sidecar-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install sidecar build dependencies
        run: python -m pip install -e ".[desktop-build]"
      - name: Build Core executable
        run: python desktop/scripts/build_core_sidecar.py
      - name: Start bundled Core
        env:
          GROWWISE_DATA_DIR: ${{ runner.temp }}/growwise-smoke
          GROWWISE_LLM_FEATURES_ENABLED: "false"
          GROWWISE_EMBEDDING_FEATURES_ENABLED: "false"
        run: |
          ./desktop/src-tauri/binaries/growwise-core > /tmp/growwise-core.log 2>&1 &
          echo $! > /tmp/growwise-core.pid
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8765/health > /tmp/growwise-health.json; then
              cat /tmp/growwise-health.json
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/growwise-core.log
          exit 1
      - name: Stop bundled Core
        if: always()
        run: |
          if [ -f /tmp/growwise-core.pid ]; then
            kill "$(cat /tmp/growwise-core.pid)" 2>/dev/null || true
          fi
