name: Product Close Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire backup management and approved material print
        run: |
          python - <<'PY'
          from pathlib import Path

          rust = Path("desktop/src-tauri/src/lib.rs")
          text = rust.read_text()
          marker = '''#[cfg_attr(mobile, tauri::mobile_entry_point)]\npub fn run() {'''
          commands = '''#[tauri::command]\nasync fn list_backups() -> Result<serde_json::Value, String> {\n    let response = client()?\n        .get(format!("{CORE_BASE_URL}/v1/admin/backups"))\n        .send()\n        .await\n        .map_err(|error| error.to_string())?;\n    ensure_success(response, "백업 목록 조회 실패")\n        .await?\n        .json::<serde_json::Value>()\n        .await\n        .map_err(|error| error.to_string())\n}\n\n#[tauri::command]\nasync fn create_backup() -> Result<serde_json::Value, String> {\n    let response = client()?\n        .post(format!("{CORE_BASE_URL}/v1/admin/backups"))\n        .json(&serde_json::json!({}))\n        .send()\n        .await\n        .map_err(|error| error.to_string())?;\n    ensure_success(response, "백업 생성 실패")\n        .await?\n        .json::<serde_json::Value>()\n        .await\n        .map_err(|error| error.to_string())\n}\n\n#[tauri::command]\nasync fn restore_backup(archive_name: String) -> Result<serde_json::Value, String> {\n    let response = client()?\n        .post(format!(\n            "{CORE_BASE_URL}/v1/admin/backups/{archive_name}/restore"\n        ))\n        .json(&serde_json::json!({"confirmed": true}))\n        .send()\n        .await\n        .map_err(|error| error.to_string())?;\n    ensure_success(response, "백업 복원 실패")\n        .await?\n        .json::<serde_json::Value>()\n        .await\n        .map_err(|error| error.to_string())\n}\n\n'''
          if commands not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f"rust insertion marker count={text.count(marker)}")
              text = text.replace(marker, commands + marker, 1)
          handlers = '''            get_infant_observation_hints,\n            get_board_book_recommendations\n        ])'''
          handlers_new = '''            get_infant_observation_hints,\n            get_board_book_recommendations,\n            list_backups,\n            create_backup,\n            restore_backup\n        ])'''
          if handlers_new not in text:
              if text.count(handlers) != 1:
                  raise SystemExit(f"rust handler marker count={text.count(handlers)}")
              text = text.replace(handlers, handlers_new, 1)
          rust.write_text(text)

          app = Path("desktop/src/App.tsx")
          text = app.read_text()
          import_marker = '''  appendConversationTurn,\n  createActivity,\n'''
          import_new = '''  appendConversationTurn,\n  createActivity,\n  createBackup,\n'''
          if text.count(import_marker) != 1:
              raise SystemExit(f"import marker count={text.count(import_marker)}")
          text = text.replace(import_marker, import_new, 1)
          import_marker2 = '''  listActivities,\n  listChildren,\n'''
          import_new2 = '''  listActivities,\n  listBackups,\n  listChildren,\n'''
          if text.count(import_marker2) != 1:
              raise SystemExit(f"import marker2 count={text.count(import_marker2)}")
          text = text.replace(import_marker2, import_new2, 1)
          import_marker3 = '''  reviewMaterial,\n  searchChildContext,\n'''
          import_new3 = '''  restoreBackup,\n  reviewMaterial,\n  searchChildContext,\n'''
          if text.count(import_marker3) != 1:
              raise SystemExit(f"import marker3 count={text.count(import_marker3)}")
          text = text.replace(import_marker3, import_new3, 1)
          type_marker = '''  type ActivityStatus,\n  type BoardBookRecommendations,\n'''
          type_new = '''  type ActivityStatus,\n  type BackupItem,\n  type BoardBookRecommendations,\n'''
          if text.count(type_marker) != 1:
              raise SystemExit(f"type marker count={text.count(type_marker)}")
          text = text.replace(type_marker, type_new, 1)

          state_marker = '''  const [materialBusy, setMaterialBusy] = useState(false);\n  const [materialError, setMaterialError] = useState<string | null>(null);\n'''
          state_new = state_marker + '''\n  const [backups, setBackups] = useState<BackupItem[]>([]);\n  const [backupBusy, setBackupBusy] = useState(false);\n  const [backupError, setBackupError] = useState<string | null>(null);\n  const [printMaterial, setPrintMaterial] = useState<GeneratedMaterial | null>(null);\n'''
          if text.count(state_marker) != 1:
              raise SystemExit(f"state marker count={text.count(state_marker)}")
          text = text.replace(state_marker, state_new, 1)

          refresh_marker = '''      const [health, runtime, storedChildren] = await Promise.all([\n        getHealth(),\n        getCoreRuntimeStatus(),\n        listChildren(),\n      ]);\n      setConnection({ kind: "connected", health, runtime });\n      setChildren(storedChildren);\n'''
          refresh_new = '''      const [health, runtime, storedChildren, storedBackups] = await Promise.all([\n        getHealth(),\n        getCoreRuntimeStatus(),\n        listChildren(),\n        listBackups(),\n      ]);\n      setConnection({ kind: "connected", health, runtime });\n      setChildren(storedChildren);\n      setBackups(storedBackups);\n'''
          if text.count(refresh_marker) != 1:
              raise SystemExit(f"refresh marker count={text.count(refresh_marker)}")
          text = text.replace(refresh_marker, refresh_new, 1)

          handler_marker = '''  function toggleAxis(axis: ExperienceAxis) {\n'''
          handlers_app = '''  async function handleCreateBackup() {\n    setBackupBusy(true);\n    setBackupError(null);\n    try {\n      await createBackup();\n      setBackups(await listBackups());\n    } catch (error) {\n      setBackupError(error instanceof Error ? error.message : "백업 생성에 실패했습니다.");\n    } finally {\n      setBackupBusy(false);\n    }\n  }\n\n  async function handleRestoreBackup(archiveName: string) {\n    const confirmed = window.confirm(\n      "현재 기록을 이 백업으로 교체합니다. 복원 전에 현재 상태를 별도 백업하는 것을 권장합니다. 계속할까요?",\n    );\n    if (!confirmed) return;\n    setBackupBusy(true);\n    setBackupError(null);\n    try {\n      await restoreBackup(archiveName);\n      await refresh();\n    } catch (error) {\n      setBackupError(error instanceof Error ? error.message : "백업 복원에 실패했습니다.");\n    } finally {\n      setBackupBusy(false);\n    }\n  }\n\n  function handlePrintMaterial(material: GeneratedMaterial) {\n    if (material.status !== "approved") return;\n    setPrintMaterial(material);\n    window.setTimeout(() => window.print(), 0);\n  }\n\n'''
          if text.count(handler_marker) != 1:
              raise SystemExit(f"app handler marker count={text.count(handler_marker)}")
          text = text.replace(handler_marker, handlers_app + handler_marker, 1)

          material_marker = '''<small>{material.generator_mode}{material.source_refs.length > 0 ? ` · 근거 ${material.source_refs.length}건` : ""}</small>{material.status === "review_pending" &&'''
          material_new = '''<small>{material.generator_mode}{material.source_refs.length > 0 ? ` · 근거 ${material.source_refs.length}건` : ""}</small>{material.status === "approved" && <button type="button" className="quiet-button" onClick={() => handlePrintMaterial(material)}>인쇄 / PDF</button>}{material.status === "review_pending" &&'''
          if text.count(material_marker) != 1:
              raise SystemExit(f"material marker count={text.count(material_marker)}")
          text = text.replace(material_marker, material_new, 1)

          closing_marker = '''      </section>\n    </main>'''
          admin_ui = '''      </section>\n\n      <section className="data-management-section">\n        <div className="activity-heading">\n          <div>\n            <p className="card-label">DATA MANAGEMENT</p>\n            <h2>백업과 복원</h2>\n            <p className="muted">Markdown 정본을 portable ZIP으로 보관하고, 복원 시 검색 인덱스를 다시 만듭니다.</p>\n          </div>\n          <button className="quiet-button" type="button" onClick={() => void handleCreateBackup()} disabled={!isConnected || backupBusy}>\n            {backupBusy ? "처리 중…" : "지금 백업"}\n          </button>\n        </div>\n        {backupError && <p className="form-error">{backupError}</p>}\n        {backups.length === 0 ? (\n          <p className="muted">아직 만든 백업이 없습니다.</p>\n        ) : (\n          <div className="quest-list">\n            {backups.map((backup) => (\n              <article className="quest-card" key={backup.archive}>\n                <div>\n                  <strong>{backup.archive}</strong>\n                  <span className="status-badge">{Math.max(1, Math.round(backup.size_bytes / 1024))} KB</span>\n                </div>\n                <p>{new Date(backup.modified_at).toLocaleString("ko-KR")}</p>\n                <button className="quiet-button" type="button" disabled={backupBusy} onClick={() => void handleRestoreBackup(backup.archive)}>이 백업 복원</button>\n              </article>\n            ))}\n          </div>\n        )}\n      </section>\n\n      {printMaterial && (\n        <article className="print-material" aria-hidden="true">\n          <h1>{printMaterial.title}</h1>\n          <pre>{printMaterial.content_markdown}</pre>\n        </article>\n      )}\n    </main>'''
          if text.count(closing_marker) != 1:
              raise SystemExit(f"closing marker count={text.count(closing_marker)}")
          app.write_text(text.replace(closing_marker, admin_ui, 1))
          PY

          cat >> desktop/src/styles.css <<'CSS'

          .data-management-section {
            margin: var(--space-6) auto;
            max-width: 1180px;
            padding: var(--space-6);
            border: 1px solid var(--border);
            border-radius: var(--radius-16);
            background: var(--surface);
          }

          .print-material { display: none; }

          @media print {
            body * { visibility: hidden !important; }
            .print-material,
            .print-material * { visibility: visible !important; }
            .print-material {
              display: block !important;
              position: absolute;
              inset: 0;
              padding: 24mm;
              background: white;
              color: black;
            }
            .print-material pre {
              white-space: pre-wrap;
              font-family: inherit;
              line-height: 1.7;
            }
          }
          CSS
      - name: Format Rust
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml
      - name: Commit product closing paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/App.tsx desktop/src/styles.css desktop/src-tauri/src/lib.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add backup UI and approved material export"
          git push origin HEAD:main
