name: Desktop Infant Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire infant guidance through Tauri and React
        run: |
          python - <<'PY'
          from pathlib import Path

          rust = Path("desktop/src-tauri/src/lib.rs")
          text = rust.read_text()
          marker = '''    ensure_success(response, "영아 활동 추천 조회 실패")\n        .await?\n        .json::<InfantActivitySuggestionsDto>()\n        .await\n        .map_err(|error| error.to_string())\n}\n\n#[cfg_attr(mobile, tauri::mobile_entry_point)]'''
          replacement = '''    ensure_success(response, "영아 활동 추천 조회 실패")\n        .await?\n        .json::<InfantActivitySuggestionsDto>()\n        .await\n        .map_err(|error| error.to_string())\n}\n\n#[tauri::command]\nasync fn get_infant_observation_hints(child_id: String) -> Result<serde_json::Value, String> {\n    let response = client()?\n        .get(format!(\n            "{CORE_BASE_URL}/v1/children/{child_id}/infant-observation-hints"\n        ))\n        .send()\n        .await\n        .map_err(|error| error.to_string())?;\n    ensure_success(response, "영아 관찰 힌트 조회 실패")\n        .await?\n        .json::<serde_json::Value>()\n        .await\n        .map_err(|error| error.to_string())\n}\n\n#[tauri::command]\nasync fn get_board_book_recommendations(child_id: String) -> Result<serde_json::Value, String> {\n    let response = client()?\n        .get(format!(\n            "{CORE_BASE_URL}/v1/children/{child_id}/board-books?limit=3"\n        ))\n        .send()\n        .await\n        .map_err(|error| error.to_string())?;\n    ensure_success(response, "보드북 추천 조회 실패")\n        .await?\n        .json::<serde_json::Value>()\n        .await\n        .map_err(|error| error.to_string())\n}\n\n#[cfg_attr(mobile, tauri::mobile_entry_point)]'''
          if text.count(marker) != 1:
              raise SystemExit(f"rust command marker count={text.count(marker)}")
          text = text.replace(marker, replacement, 1)
          old_handlers = '''            review_material,\n            get_growth_map,\n            get_infant_activities\n        ])'''
          new_handlers = '''            review_material,\n            get_growth_map,\n            get_infant_activities,\n            get_infant_observation_hints,\n            get_board_book_recommendations\n        ])'''
          if text.count(old_handlers) != 1:
              raise SystemExit(f"handler marker count={text.count(old_handlers)}")
          rust.write_text(text.replace(old_handlers, new_handlers, 1))

          app = Path("desktop/src/App.tsx")
          text = app.read_text()
          old_import = '''  generateMaterial,\n  getCoreRuntimeStatus,\n  getGrowthMap,\n  getHealth,\n  getInfantActivities,\n'''
          new_import = '''  generateMaterial,\n  getBoardBookRecommendations,\n  getCoreRuntimeStatus,\n  getGrowthMap,\n  getHealth,\n  getInfantActivities,\n  getInfantObservationHints,\n'''
          if text.count(old_import) != 1:
              raise SystemExit(f"function import marker count={text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)
          old_types = '''  type ActivityStatus,\n  type ChildProfile,\n'''
          new_types = '''  type ActivityStatus,\n  type BoardBookRecommendations,\n  type ChildProfile,\n'''
          if text.count(old_types) != 1:
              raise SystemExit(f"type import marker count={text.count(old_types)}")
          text = text.replace(old_types, new_types, 1)
          old_types2 = '''  type InfantActivitySuggestions,\n  type LearningLog,\n'''
          new_types2 = '''  type InfantActivitySuggestions,\n  type InfantObservationHints,\n  type LearningLog,\n'''
          if text.count(old_types2) != 1:
              raise SystemExit(f"type import marker 2 count={text.count(old_types2)}")
          text = text.replace(old_types2, new_types2, 1)

          state_marker = '''  const [activities, setActivities] = useState<InfantActivitySuggestions | null>(null);\n  const [activitiesLoading, setActivitiesLoading] = useState(false);\n  const [activitiesError, setActivitiesError] = useState<string | null>(null);\n  const [activityPlanBusy, setActivityPlanBusy] = useState(false);\n'''
          state_replacement = state_marker + '''  const [observationHints, setObservationHints] = useState<InfantObservationHints | null>(null);\n  const [boardBooks, setBoardBooks] = useState<BoardBookRecommendations | null>(null);\n  const [infantGuidanceLoading, setInfantGuidanceLoading] = useState(false);\n  const [infantGuidanceError, setInfantGuidanceError] = useState<string | null>(null);\n'''
          if text.count(state_marker) != 1:
              raise SystemExit(f"state marker count={text.count(state_marker)}")
          text = text.replace(state_marker, state_replacement, 1)

          reset_marker = '''    setActivities(null);\n    setSearchResult(null);\n'''
          reset_replacement = '''    setActivities(null);\n    setObservationHints(null);\n    setBoardBooks(null);\n    setInfantGuidanceError(null);\n    setSearchResult(null);\n'''
          if text.count(reset_marker) != 1:
              raise SystemExit(f"reset marker count={text.count(reset_marker)}")
          text = text.replace(reset_marker, reset_replacement, 1)

          handler_marker = '''  async function handleSaveActivity(title: string) {\n'''
          handler = '''  async function handleLoadInfantGuidance() {\n    if (!activeChild) return;\n    setInfantGuidanceLoading(true);\n    setInfantGuidanceError(null);\n    try {\n      const [hints, books] = await Promise.all([\n        getInfantObservationHints(activeChild.id),\n        getBoardBookRecommendations(activeChild.id),\n      ]);\n      setObservationHints(hints);\n      setBoardBooks(books);\n    } catch (error) {\n      setInfantGuidanceError(\n        error instanceof Error ? error.message : "영아 관찰 가이드를 불러오지 못했습니다.",\n      );\n    } finally {\n      setInfantGuidanceLoading(false);\n    }\n  }\n\n'''
          if text.count(handler_marker) != 1:
              raise SystemExit(f"handler marker count={text.count(handler_marker)}")
          text = text.replace(handler_marker, handler + handler_marker, 1)

          ui_marker = '''          <section className="activity-section"><div className="activity-heading">'''
          ui = '''          {activeChild.stage === "infant_0_2" && (\n            <section className="infant-guidance-section">\n              <div className="activity-heading">\n                <div>\n                  <p className="card-label">INFANT OBSERVATION GUIDE</p>\n                  <h3>관찰 힌트와 보드북 연결</h3>\n                  <p className="muted">진단 체크리스트가 아니라 일상에서 무엇을 살펴볼지 돕습니다.</p>\n                </div>\n                <button\n                  className="quiet-button"\n                  type="button"\n                  onClick={() => void handleLoadInfantGuidance()}\n                  disabled={infantGuidanceLoading}\n                >\n                  {infantGuidanceLoading ? "불러오는 중…" : "관찰 힌트·책 보기"}\n                </button>\n              </div>\n              {infantGuidanceError && <p className="form-error">{infantGuidanceError}</p>}\n              {(observationHints || boardBooks) && (\n                <div className="resource-grid">\n                  <div className="resource-list">\n                    <p className="card-label">OBSERVATION HINTS</p>\n                    <h3>{observationHints?.hints.length ?? 0}개 영역</h3>\n                    {observationHints?.hints.map((hint) => (\n                      <article className="resource-card" key={hint.domain}>\n                        <strong>{hint.domain}</strong>\n                        <p>{hint.cue}</p>\n                        <small>{hint.rationale}</small>\n                      </article>\n                    ))}\n                    {observationHints && (\n                      <p className="muted">{observationHints.source} · 진단용 아님</p>\n                    )}\n                  </div>\n                  <div className="resource-list">\n                    <p className="card-label">BOARD BOOKS</p>\n                    <h3>{boardBooks?.recommendations.length ?? 0}권</h3>\n                    {boardBooks?.recommendations.map((book) => (\n                      <article className="resource-card" key={`${book.resource_id ?? book.title}-${book.title}`}>\n                        <strong>{book.title}</strong>\n                        <p>{book.reason}</p>\n                        <small>{book.read_aloud_tip}</small>\n                      </article>\n                    ))}\n                  </div>\n                </div>\n              )}\n            </section>\n          )}\n\n'''
          if text.count(ui_marker) != 1:
              raise SystemExit(f"UI marker count={text.count(ui_marker)}")
          app.write_text(text.replace(ui_marker, ui + ui_marker, 1))
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/App.tsx desktop/src-tauri/src/lib.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: expose infant guidance in desktop"
          git push origin HEAD:main
