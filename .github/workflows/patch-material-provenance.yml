name: Patch material provenance once

on:
  push:
    branches: [codex/material-provenance-e2e]
    paths:
      - .github/workflows/patch-material-provenance.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/material-provenance-e2e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply provenance patch
        run: python .github/scripts/patch_material_provenance.py
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Verify provenance slice
        run: |
          uv sync --locked --extra dev
          uv run ruff check --fix src/growwise/api/main.py tests/test_material_adversarial.py
          uv run ruff check src tests desktop/scripts
          uv run mypy src/growwise
          uv run pytest tests/test_material_adversarial.py tests/test_materials.py tests/test_material_scaffold.py tests/test_material_review_workflow.py
      - name: Commit verified provenance slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/growwise/api/main.py tests/test_material_adversarial.py
          git commit -m "fix: enforce material source provenance"
          git push origin HEAD:codex/material-provenance-e2e
