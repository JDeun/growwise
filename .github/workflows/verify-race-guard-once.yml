name: Verify material version race guard once
on:
  push:
    branches: [codex/material-version-race-guard]
    paths: [.github/workflows/verify-race-guard-once.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/material-version-race-guard
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Verify race guard
        run: |
          uv lock --check
          uv run ruff check src tests desktop/scripts
          uv run mypy src/growwise
          uv run pytest tests/test_material_version_concurrency.py tests/test_material_editing.py
          uv run pytest
      - name: Remove one-time verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-race-guard-once.yml
          git commit -m "chore: remove race guard verifier"
          git push origin HEAD:codex/material-version-race-guard
