name: Backup Router Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register backup API router
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/growwise/api/main.py")
          text = path.read_text()
          import_marker = "from growwise.config import Settings\n"
          import_line = "from growwise.api.backup_routes import router as backup_router\n"
          if import_line not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit("settings import marker not found exactly once")
              text = text.replace(import_marker, import_line + import_marker, 1)
          app_marker = 'app = FastAPI(title="GrowWise Core", version="0.1.0a0")\n'
          include_line = 'app.include_router(backup_router)\n'
          if include_line not in text:
              if text.count(app_marker) != 1:
                  raise SystemExit("app marker not found exactly once")
              text = text.replace(app_marker, app_marker + include_line, 1)
          path.write_text(text)
          PY
      - name: Commit router wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/growwise/api/main.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: register backup API router"
          git push origin HEAD:main
