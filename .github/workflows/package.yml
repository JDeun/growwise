name: Desktop Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/package.yml"
      - "assets/brand/**"
      - "desktop/**"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "rust-toolchain.toml"
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.artifact_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: growwise-windows-x64
            bundles: nsis
            artifact_path: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
            apple_signing_identity: ""
          - os: macos-latest
            platform: macos
            artifact_name: growwise-macos-arm64
            bundles: dmg
            artifact_path: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
              desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
              desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            apple_signing_identity: "-"
          - os: macos-15-intel
            platform: macos
            artifact_name: growwise-macos-x64
            bundles: dmg
            artifact_path: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
              desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
              desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            apple_signing_identity: "-"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Verify desktop release metadata
        run: python desktop/scripts/check_release_readiness.py
      - name: Verify tagged release readiness
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python desktop/scripts/check_release_readiness.py --tag "${{ github.ref_name }}" --platform "${{ matrix.platform }}"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      - name: Verify single Core data-directory lock
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml data_directory_lock_rejects_second_core_until_release --lib
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Sync locked sidecar build environment
        run: uv sync --locked --extra desktop-build
      - name: Pin npm
        run: npm install --global npm@11.6.2
      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Generate branded platform icons
        working-directory: desktop
        run: npm run tauri -- icon ../assets/brand/growwise-symbol.svg
      - name: Build Core sidecar
        run: uv run python desktop/scripts/build_core_sidecar.py
      - name: Smoke Core sidecar
        run: uv run python desktop/scripts/smoke_core_sidecar.py
      - name: Configure ad-hoc macOS signing for validation builds
        if: matrix.platform == 'macos' && (!startsWith(github.ref, 'refs/tags/v') || contains(github.ref_name, '-'))
        shell: bash
        run: echo "APPLE_SIGNING_IDENTITY=${{ matrix.apple_signing_identity }}" >> "$GITHUB_ENV"
      - name: Import Developer ID certificate
        if: matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          CERT_ID="$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -n 1 | awk -F'"' '{print $2}')"
          test -n "$CERT_ID"
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
      - name: Import Windows signing certificate
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          Set-Content -Path certificate-base64.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate-base64.txt certificate.pfx | Out-Null
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "Windows signing certificate import failed" }
          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          }
          $config | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 desktop/src-tauri/tauri.windows.conf.json
      - name: Build validation or prerelease desktop bundle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || contains(github.ref_name, '-') }}
        working-directory: desktop
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Build stable Windows bundle
        if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
      - name: Build signed and notarized stable macOS bundle
        if: matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        working-directory: desktop
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: growwise-*
          path: dist
      - name: Prepare release assets and updater manifest
        run: |
          python desktop/scripts/prepare_release_assets.py \
            --input-dir dist \
            --output-dir release-assets \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            args=(release create "$GITHUB_REF_NAME" --title "GrowWise ${GITHUB_REF_NAME#v}" --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
          while IFS= read -r -d '' file; do
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          done < <(find release-assets -maxdepth 1 -type f -print0)
