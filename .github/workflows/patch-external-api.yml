name: Patch external enrichment API once

on:
  push:
    branches: [codex/external-enrichment-api]
    paths:
      - .github/workflows/patch-external-api.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/external-enrichment-api
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Integrate optional external router
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/growwise/api/main.py")
          text = path.read_text(encoding="utf-8")
          import_anchor = "from growwise.api.backup_routes import router as backup_router\n"
          external_import = "from growwise.api.external_routes import router as external_router\n"
          if external_import not in text:
              if import_anchor not in text:
                  raise SystemExit("backup router import anchor missing")
              text = text.replace(import_anchor, import_anchor + external_import, 1)
          include_anchor = "app.include_router(backup_router)\n"
          external_include = "app.include_router(external_router)\n"
          if external_include not in text:
              if include_anchor not in text:
                  raise SystemExit("backup router include anchor missing")
              text = text.replace(include_anchor, include_anchor + external_include, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install uv
        run: python -m pip install "uv==0.12.13"
      - name: Verify external enrichment boundary after URL assertion fix
        run: |
          uv sync --locked --extra dev
          uv run ruff check src tests desktop/scripts
          uv run mypy src/growwise
          uv run pytest tests/test_external_routes.py tests/test_external_adapters.py
      - name: Commit verified slice and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-external-api.yml
          git add src/growwise/api/main.py
          git commit -m "feat: integrate optional external enrichment API"
          git push origin HEAD:codex/external-enrichment-api
