name: Observation Source Fix Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve parent source text at persistence boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/growwise/api/main.py")
          text = path.read_text()
          old = '            parent_observation=state["normalized_observation"],'
          new = '            parent_observation=request.observation,'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one observation persistence site, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/growwise/api/main.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: persist parent observation source verbatim"
          git push origin HEAD:main
