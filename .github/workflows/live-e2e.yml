name: Live Browser E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-ui-with-core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned uv
        run: python -m pip install "uv==0.12.13"
      - name: Install reviewed Python runtime
        shell: bash
        run: python desktop/scripts/install_packaging_python.py --github-env "$GITHUB_ENV"
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Pin npm
        run: npm install --global npm@11.6.2
      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build production frontend
        working-directory: desktop
        run: npm run build
      - name: Exercise production UI with authenticated temporary Core
        working-directory: desktop
        run: npm run test:live
        env:
          GROWWISE_E2E_ARTIFACTS: ${{ github.workspace }}/desktop/artifacts/live-e2e
          GROWWISE_E2E_SOAK_SECONDS: "120"
          GROWWISE_E2E_SOAK_RECORDS: "1000"
      - name: Upload live journey report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: growwise-live-e2e-${{ matrix.os }}
          path: desktop/artifacts/live-e2e
          if-no-files-found: warn
          retention-days: 7
