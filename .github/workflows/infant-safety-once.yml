name: Infant Safety Once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden LLM observation hints
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/growwise/services/infant.py")
          text = path.read_text()
          old = '''            allowed = set(InfantCurriculumDomain)\n            by_domain = {hint.domain: hint for hint in result.hints if hint.domain in allowed}\n            result.hints = [by_domain.get(hint.domain, hint) for hint in fallback.hints]\n            result.source = CURRICULUM_SOURCE\n'''
          new = '''            allowed = set(InfantCurriculumDomain)\n            forbidden = (\n                "adhd", "autism", "diagnos", "자폐", "발달장애", "진단",\n                "비정상", "또래보다", "또래 평균", "상위 ", "하위 ", "퍼센타일",\n            )\n            by_domain = {}\n            for hint in result.hints:\n                text_value = f"{hint.cue} {hint.rationale}".casefold()\n                if hint.domain in allowed and not any(\n                    marker in text_value for marker in forbidden\n                ):\n                    by_domain[hint.domain] = hint\n            result.hints = [by_domain.get(hint.domain, hint) for hint in fallback.hints]\n            result.source = CURRICULUM_SOURCE\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected infant hint sanitization marker once, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/growwise/services/infant.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: sanitize infant observation hint output"
          git push origin HEAD:main
